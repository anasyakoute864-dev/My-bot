name: gold-experiments

on:
  workflow_dispatch:
    inputs:
      step:
        description: "خطوة الشموع (1 = كل شمعة، 3 = أسرع)"
        default: "1"
      style:
        description: "نمط الإشارة"
        type: choice
        options: [scalp, swing]
        default: scalp

jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run walk-forward experiments
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SIGNAL_STYLE: ${{ github.event.inputs.style || 'scalp' }}
          TRADE_HOURS_ET: "off"
        run: python experiments.py "${{ github.event.inputs.step || '1' }}"
