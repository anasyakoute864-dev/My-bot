name: probe-spot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python probe_spot.py
      - name: Save to repo
        if: always()
        run: |
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/probe_spot.txt; git commit -m "spot probe" || exit 0
          git pull --rebase -q origin main || true; git push || true
