name: gold-signals
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore sent-signals memory
        uses: actions/cache@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: |
            sent-
      - run: pip install yfinance pandas numpy requests
      - run: python gold_signals.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          LOOKBACK_BARS: "4"
          INTERVAL_MIN: "30"
          MIN_SCORE: "4"
          HEARTBEAT_HOUR_UTC: "12"
