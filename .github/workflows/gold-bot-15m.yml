name: gold-signals-15m

on:
  schedule:
    # 24 ساعة على 24 (الاثنين-الجمعة)، كل 15 دقيقة. الـ repo public = دقايق Actions غير محدودة
    - cron: "3,18,33,48 * * * 1-5"
  workflow_dispatch:
    inputs:
      test_signal:
        description: "صيفط صفقة وهمية للتجربة"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-signals-15m
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Restore last signal
        uses: actions/cache@v4
        with:
          path: last_signal_15m.json
          key: last-signal-15m-${{ github.run_id }}
          restore-keys: last-signal-15m-

      - name: Run bot (15m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ENTRY_TF: "15m"
          MIN_SCORE: "3"
          TRADE_HOURS_ET: "off"   # off = 24/24 | "3-12" = غير لندن+نيويورك (أحسن فالـ backtest)
          SIGNAL_STYLE: scalp
          SCALP_STOP_ATR: "2.5"   # ستوب 2.5 ATR + الستوب للدخول من بعد الهدف الأول (backtest: PF 2.0)
          SCALP_TARGETS: "0.75,1,1.5,2,2.5"   # 5 أهداف بـ ATR
          SYMBOL: GC=F
          CRABEL: "1"   # Toby Crabel: Opening Range Breakout (Stretch)
          CRABEL_ONLY: "1"   # غير استراتيجية Crabel، بلا أي شي آخر
          CRABEL_NR7: "0"
          CRABEL_OPEN_ET: "8"
          CRABEL_EXIT_ET: "17"
          ICT: "0"   # نموذج ICT: رينج آسيا -> سحب سيولة -> CISD -> FVG -> هدف الرينج
          ICT_HTF: "1"   # ما نداخلش ICT ضد الاتجاه اليومي
          ICT_RANGE_ET: "20-2"
          ICT_ENTRY_ET: "2-11"
          STATE_FILE: last_signal_15m.json
          SIGNAL_LABEL: "⚡ 15m"
          STRONG_HOURS_ET: "3-12"   # الإشارات خارج هاد الساعات كتجي بتحذير
          V_ALERT: "0"   # تنبيه حركة V (معلومة فقط)
          TEST_SIGNAL: ${{ github.event.inputs.test_signal == 'true' && '1' || '0' }}
          ALWAYS_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python gold_bot.py

      - name: Save live status (manual runs only)
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          mkdir -p results
          cp live_status.txt results/live_status_15m.txt || exit 0
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/live_status_15m.txt
          git commit -m "live status 15m" || exit 0
          git pull --rebase -q origin main || true
          git push || true
