name: gold-signals-15m

on:
  schedule:
    # 24 ساعة على 24 (الاثنين-الجمعة)، كل 15 دقيقة. الـ repo public = دقايق Actions غير محدودة
    - cron: "3,18,33,48 * * * 1-5"
  workflow_dispatch:
    inputs:
      test_signal:
        description: "صيفط صفقة وهمية للتجربة"
        type: boolean
        default: false
      always_send:
        description: "تشغيل يدوي: صيفط رسالة قصيرة وسجل الحالة (cron-job.org كيشغل بلا هادشي)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# التشغيلات اليدوية (تجربة/حالة) عندها مجموعة خاصة باش ما تستناش السلسلة الطويلة
concurrency:
  group: gold-signals-15m-${{ (github.event.inputs.test_signal == 'true' || github.event.inputs.always_send == 'true') && 'manual' || 'chain' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Restore last signal
        uses: actions/cache@v4
        with:
          path: last_signal_15m.json
          key: last-signal-15m-${{ github.run_id }}
          restore-keys: last-signal-15m-

      - name: Run bot (15m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ENTRY_TF: "15m"
          MIN_SCORE: "3"
          TRADE_HOURS_ET: "3-17"   # الاستراتيجية ديالنا: من 3:00 حتى آخر جلسة نيويورك 17:00 (نيويورك). Crabel عندو ساعاتو
          SIGNAL_STYLE: scalp
          SCALP_STOP_ATR: "2.5"   # ستوب 2.5 ATR + الستوب للدخول من بعد الهدف الأول (backtest: PF 2.0)
          SCALP_TARGETS: "0.75,1,1.5,2,2.5"   # 5 أهداف بـ ATR
          SYMBOL: GC=F
          CRABEL: "1"   # Toby Crabel: Opening Range Breakout (Stretch)
          CRABEL_ONLY: "0"   # 0 = Crabel كل نهار + استراتيجية البوت الأول (السكور) كيخدمو مع بعض
          CRABEL_SESSIONS: "3-11,8-17"   # لندن 03:00-11:00 | نيويورك 08:00-17:00 (نيويورك)
          CRABEL_TP: "2"   # TP = 2 × Stretch (نفس مسافة الستوب، RR 1:1)
          ICT: "0"   # نموذج ICT: رينج آسيا -> سحب سيولة -> CISD -> FVG -> هدف الرينج
          ICT_HTF: "1"   # ما نداخلش ICT ضد الاتجاه اليومي
          ICT_RANGE_ET: "20-2"
          ICT_ENTRY_ET: "2-11"
          STATE_FILE: last_signal_15m.json
          SIGNAL_LABEL: "⚡ 15m"
          LATE_NOTE_MIN: "20"   # إيلا الإشارة وصلات متأخرة 20 دقيقة ولا أكثر كيزاد سطر تنبيه. 0 = مطفي
          SCALP_OLD: "1"   # إشارة سكالب إضافية (علامة "Scalp"): ستوب 5×ATR وهدف واحد 0.25×ATR. 0 = مطفي
          MAX_LOSSES_DAY: "2"   # بعد خسارتين ف نفس النهار (نيويورك) ما كتصيفطش إشارات جديدة ديال السكور (Crabel ما كيتأثرش). 0 = مطفي
          STRONG_HOURS_ET: "3-17"   # الإشارات خارج هاد الساعات كتجي بتحذير
          TEST_SIGNAL: ${{ github.event.inputs.test_signal == 'true' && '1' || '0' }}
          ALWAYS_SEND: ${{ github.event.inputs.always_send == 'true' && '1' || '0' }}
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.test_signal }}" = "true" ] || [ "${{ github.event.inputs.always_send }}" = "true" ]; then
            python gold_bot.py 2>&1 | tee bot_run.log
          else
            LOOP_MINUTES=50 bash loop.sh
          fi

      # كيعاود يشغل نفسو (تشغيل سلسلة) باش البوت يبقى خدام كل 15 دقيقة بلا ما نستناو جدول GitHub.
      # كيوقف وحدو ف نهاية الأسبوع (من الجمعة 22:00 UTC حتى الاثنين). الجدول القديم بقا احتياط.
      - name: Chain next run
        if: always() && github.event.inputs.test_signal != 'true' && github.event.inputs.always_send != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SELF_CHAIN: "1"
        run: |
          [ "$SELF_CHAIN" = "1" ] || exit 0
          dow=$(date -u +%u); hr=$(date -u +%-H)
          if [ "$dow" -le 5 ] && ! { [ "$dow" -eq 5 ] && [ "$hr" -ge 22 ]; }; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/gold-bot-15m.yml/dispatches -f ref=main || true
          fi

      - name: Save live status (manual runs only)
        if: github.event.inputs.always_send == 'true' && always()
        run: |
          mkdir -p results
          cp bot_run.log results/bot_run_15m.txt || true
          cp live_status.txt results/live_status_15m.txt || exit 0
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/live_status_15m.txt results/bot_run_15m.txt
          git commit -m "live status 15m" || exit 0
          git pull --rebase -q origin main || true
          git push || true
