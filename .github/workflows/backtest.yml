name: gold-backtest

on:
  workflow_dispatch:
    inputs:
      step:
        description: "خطوة الشموع (1 = كل شمعة، 3 = أسرع)"
        default: "1"
      tf:
        description: "الفريم: 1h ولا 15m"
        default: "1h"
      min_score:
        description: "MIN_SCORE (3 / 4 / 5 ...)"
        default: "5"
      vshape:
        description: "كشف حركة V: 1 ولا 0"
        default: "0"
      stop_atr:
        description: "scalp: الستوب بـ ATR (5 = الحالي)"
        default: "5.0"
      targets:
        description: "scalp: 5 أهداف بـ ATR مفصولة بفاصلة"
        default: "0.25,0.5,0.65,0.8,1.0"
      be:
        description: "الستوب للدخول من بعد الهدف الأول (1/0)"
        default: "0"
      ict:
        description: "نموذج ICT: 0 (طافي) | 1 (مع السكور) | only (غير ICT)"
        default: "0"
      ict_htf:
        description: "ICT: ما نداخلش ضد الاتجاه اليومي (1/0)"
        default: "0"
      ict_range:
        description: "ساعات الرينج نيويورك (20-2 آسيا | 2-7 لندن)"
        default: "20-2"
      ict_entry:
        description: "ساعات السحب والدخول نيويورك"
        default: "2-11"
      amd:
        description: "AMD (تلاعب-توزيع-تأكيد): 1 ولا 0"
        default: "0"
      symbol:
        description: "الرمز: GC=F (فيوتشرز) ولا XAUUSD=X (فوري)"
        default: "GC=F"
      hours:
        description: "ساعات التداول بتوقيت نيويورك (مثلا 3-12) ولا off"
        default: "3-12"
      style:
        description: "نمط الإشارة: swing ولا scalp"
        type: choice
        options: [swing, scalp]
        default: swing

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ENTRY_TF: ${{ github.event.inputs.tf || '1h' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '5' }}
          VSHAPE: ${{ github.event.inputs.vshape || '0' }}
          AMD: ${{ github.event.inputs.amd || '0' }}
          ICT: ${{ (github.event.inputs.ict == '1' || github.event.inputs.ict == 'only') && '1' || '0' }}
          ICT_ONLY: ${{ github.event.inputs.ict == 'only' && '1' || '0' }}
          BE_AFTER_TP1: ${{ github.event.inputs.be || '0' }}
          ICT_HTF: ${{ github.event.inputs.ict_htf || '0' }}
          ICT_RANGE_ET: ${{ github.event.inputs.ict_range || '20-2' }}
          ICT_ENTRY_ET: ${{ github.event.inputs.ict_entry || '2-11' }}
          SCALP_STOP_ATR: ${{ github.event.inputs.stop_atr || '5.0' }}
          SCALP_TARGETS: ${{ github.event.inputs.targets || '0.25,0.5,0.65,0.8,1.0' }}
          SYMBOL: ${{ github.event.inputs.symbol || 'GC=F' }}
          TRADE_HOURS_ET: ${{ github.event.inputs.hours || '3-12' }}
          SIGNAL_STYLE: ${{ github.event.inputs.style || 'swing' }}
        shell: bash
        run: |
          mkdir -p results
          set -o pipefail
          python backtest.py "${{ github.event.inputs.step || '1' }}" 2>&1 | tee "results/bt_${ENTRY_TF}_ms${MIN_SCORE}_${SIGNAL_STYLE}_h${TRADE_HOURS_ET}_v${VSHAPE}_amd${AMD}_be${BE_AFTER_TP1}_ict${ICT}${ICT_ONLY}h${ICT_HTF}_r${ICT_RANGE_ET}_e${ICT_ENTRY_ET}_s${SCALP_STOP_ATR}_t${SCALP_TARGETS//,/-}.txt"

      - name: Save log to repo
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/bt_*.txt
          git commit -m "backtest log (symbol=${SYMBOL} style=${SIGNAL_STYLE})" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
        env:
          ENTRY_TF: ${{ github.event.inputs.tf || '1h' }}
          MIN_SCORE: ${{ github.event.inputs.min_score || '5' }}
          SYMBOL: ${{ github.event.inputs.symbol || 'GC=F' }}
          SIGNAL_STYLE: ${{ github.event.inputs.style || 'swing' }}

      - name: Save trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: trades.csv
          if-no-files-found: ignore
