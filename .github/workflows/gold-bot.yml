name: gold-signals

on:
  schedule:
    # كل ساعة فالدقيقة 3 (من بعد سدان شمعة 1h بشوية). ~625 دقيقة من 2000 فالشهر
    - cron: "3 * * * 0-5"
  workflow_dispatch:
    inputs:
      test_signal:
        description: "صيفط صفقة وهمية للتجربة"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Restore last signal
        uses: actions/cache@v4
        with:
          path: last_signal.json
          key: last-signal-${{ github.run_id }}
          restore-keys: last-signal-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TRADE_HOURS_ET: "off"   # off = إشارات فكل الساعات | "3-12" = غير لندن+أمريكا (نيويورك)
          SYMBOL: GC=F   # بدلو بـ XAUUSD=X من بعد ما يكتب الـ backtest نتيجة مزيانة
          SIGNAL_STYLE: scalp   # scalp = أهداف قريبة (5) وستوب بعيد | swing = 1R-3R
          # التشغيل اليدوي كيرسل دائما (للتجربة)، والتلقائي كيرسل غير الإشارات الجديدة
          TEST_SIGNAL: ${{ github.event.inputs.test_signal == 'true' && '1' || '0' }}
          ALWAYS_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python gold_bot.py

      - name: Save live status (manual runs only)
        if: github.event_name == 'workflow_dispatch' && always()
        run: |
          mkdir -p results
          cp live_status.txt results/live_status.txt || exit 0
          git config user.name "gold-bot"; git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/live_status.txt
          git commit -m "live status" || exit 0
          git pull --rebase -q origin main || true
          git push || true
