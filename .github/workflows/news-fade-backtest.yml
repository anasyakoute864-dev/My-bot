name: news-fade-backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "الرمز: GC=F (الذهب)"
        default: "GC=F"

permissions:
  contents: write

jobs:
  val:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install yfinance pandas numpy requests
      - name: Run news fade backtest
        env:
          SYMBOL: ${{ github.event.inputs.symbol || 'GC=F' }}
          FIB_TF: 5m
        run: python news_fade_backtest.py
      - name: Save log to repo
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add -f results/news_fade_backtest.txt
          git commit -m "news fade backtest log" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin main && git push -q && break; sleep $((RANDOM % 10 + 3)); done
